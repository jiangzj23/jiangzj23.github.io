<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zhuojun Jiang — academic personal website."
    />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Zhuojun Jiang</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="content.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="wordmark" href="index.html" aria-label="Go to home">
          <img
            class="wordmark-logo"
            src="assets/logo-zhuojun-jiang.png"
            alt="Zhuojun Jiang"
          />
        </a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span class="sr-only">Toggle navigation</span><span></span
          ><span></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
          <a href="index.html" aria-current="page">About</a>
          <a href="work.html">Work</a>
          <a href="life.html">Life</a>
          <a href="connect.html">Connect</a>
          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle color theme"
          >
            <span aria-hidden="true">◐</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="single-page-main" id="main-content">
      <section class="hero container">
        <div class="hero-copy reveal">
          <h1>Hi, I’m <em>Zhuojun</em>.</h1>
          <p class="hero-intro" id="profile-bio"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="work.html"
              >Explore my work</a
            >
            <a class="button button-text" id="cv-link" href="#" hidden
              >CV <span aria-hidden="true">↗</span></a
            >
          </div>
          <div
            class="social-links"
            id="social-links"
            aria-label="Professional profiles"
          ></div>
        </div>
        <div class="portrait-wrap reveal" aria-label="Profile portrait">
          <div class="portrait-frame">
            <img id="profile-image" alt="Portrait of Zhuojun Jiang" hidden />
            <span
              class="portrait-initials"
              id="portrait-initials"
              aria-hidden="true"
              >ZJ</span
            >
          </div>
          <div class="portrait-caption">
            <span class="status-dot" aria-hidden="true"></span
            ><span id="profile-location">Tempe, Arizona</span>
          </div>
        </div>
      </section>

      <section class="home-updates">
        <div class="container home-updates-layout">
          <header class="home-updates-heading">
            <p class="page-kicker">Updates</p>
            <h2>What’s new</h2>
          </header>
          <ol class="news-list" id="news-list"></ol>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span class="current-year"></span> Zhuojun Jiang</p>
        <!-- <p>Designed and built with HTML, CSS &amp; JavaScript.</p> -->
      </div>
    </footer>
  </body>
</html>
