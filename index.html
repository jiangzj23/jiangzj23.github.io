<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zhuojun Jiang — academic personal website."
    />
    <meta name="theme-color" content="#f7f5ef" />
    <title>Zhuojun Jiang</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="content.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="wordmark" href="index.html" aria-label="Go to home">
          <img
            class="wordmark-logo"
            src="assets/logo-zhuojun-jiang.png"
            alt="Zhuojun Jiang"
          />
        </a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span class="sr-only">Toggle navigation</span><span></span
          ><span></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
          <a href="index.html" aria-current="page">About</a
          ><a href="research.html">Research</a>
          <a href="publications.html">Publications</a
          ><a href="projects.html">Projects</a>
          <a href="updates.html">Updates</a><a href="contact.html">Contact</a>
          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle color theme"
          >
            <span aria-hidden="true">◐</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="single-page-main" id="main-content">
      <section class="hero container">
        <div class="hero-copy reveal">
          <p class="eyebrow" id="profile-role">Researcher</p>
          <h1>Ideas become clearer<br />when we can <em>see</em> them.</h1>
          <p class="hero-intro" id="profile-bio"></p>
          <div class="hero-actions">
            <a class="button button-primary" href="research.html"
              >Explore my work</a
            >
            <a class="button button-text" id="cv-link" href="#" hidden
              >Download CV <span aria-hidden="true">↗</span></a
            >
          </div>
          <div
            class="social-links"
            id="social-links"
            aria-label="Professional profiles"
          ></div>
        </div>
        <div class="portrait-wrap reveal" aria-label="Profile portrait">
          <div class="portrait-frame">
            <img id="profile-image" alt="Portrait of Zhuojun Jiang" hidden />
            <span
              class="portrait-initials"
              id="portrait-initials"
              aria-hidden="true"
              >ZJ</span
            >
          </div>
          <div class="portrait-caption">
            <span class="status-dot" aria-hidden="true"></span
            ><span id="profile-location">Tempe, Arizona</span>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span class="current-year"></span> Zhuojun Jiang</p>
        <p>Designed and built with HTML, CSS &amp; JavaScript.</p>
      </div>
    </footer>
  </body>
</html>
