<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zhuojun Jiang — academic personal website."
    />
    <meta name="theme-color" content="#fcfcf9" />
    <title>Zhuojun Jiang</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="content.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body class="home-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="wordmark" href="index.html" aria-label="Go to home">
          <img
            class="wordmark-logo"
            src="assets/logo-zhuojun-jiang.png"
            alt="Zhuojun Jiang"
          />
        </a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="site-nav"
        >
          <span class="sr-only">Toggle navigation</span><span></span
          ><span></span>
        </button>
        <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
          <a href="index.html" aria-current="page">About</a>
          <a href="work.html">Work</a>
          <a href="life.html">Life</a>
          <a href="connect.html">Connect</a>
          <button
            class="theme-toggle"
            type="button"
            aria-label="Toggle color theme"
          >
            <span aria-hidden="true">◐</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="single-page-main home-layout container" id="main-content">
      <aside class="home-profile" aria-label="Profile and links">
        <div class="portrait-wrap" aria-label="Profile artwork">
          <div class="portrait-frame">
            <img id="profile-image" alt="Cactus illustration" hidden />
            <span class="portrait-initials" id="portrait-initials" aria-hidden="true">ZJ</span>
          </div>
        </div>
        <p class="home-profile-name">Zhuojun Jiang</p>
        <p class="home-profile-role">Computer Science PhD student<br />Arizona State University</p>
        <p class="home-profile-location" id="profile-location">Tempe, Arizona</p>
        <div class="home-profile-links">
          <div class="social-links" id="social-links" aria-label="Professional profiles"></div>
          <a class="home-cv-link" id="cv-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open academic CV (PDF)" title="Academic CV (PDF)" hidden>
            <img src="assets/logo/icon-cv.png" alt="" />
          </a>
        </div>
      </aside>

      <div class="home-content">
      <section class="hero">
        <div class="hero-copy reveal">
          <h1>Hi, I’m <em>Zhuojun</em></h1>
          <p class="hero-intro" id="profile-bio"></p>
        </div>
      </section>

      <section class="home-updates" aria-labelledby="updates-heading">
        <div class="home-updates-layout">
          <header class="home-updates-heading">
            <h2 id="updates-heading">Updates</h2>
          </header>
          <ol class="news-list" id="news-list"></ol>
        </div>
      </section>

      <section class="home-recent-work" aria-labelledby="selected-publications-heading">
        <header class="home-section-heading">
          <h2 id="selected-publications-heading">Selected Publications</h2>
          <a href="work.html#publications">All publications →</a>
        </header>
        <div class="home-work-list" id="home-work-list"></div>
      </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>© <span class="current-year"></span> Zhuojun Jiang</p>
        <!-- <p>Designed and built with HTML, CSS &amp; JavaScript.</p> -->
      </div>
    </footer>
  </body>
</html>
